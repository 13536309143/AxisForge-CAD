name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev ninja-build xvfb libgl1-mesa-dri libtbb-dev libfreetype6-dev libfontconfig1-dev libfreeimage-dev libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-visualization-dev libocct-ocaf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: build/test-artifacts
  windows-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'release: v0.5.0')
    needs: linux-qt6
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Download official OCCT SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory deps/occt,deps/thirdparty -Force | Out-Null
          Invoke-WebRequest https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64.zip -OutFile deps/sdk.zip
          if ((Get-FileHash deps/sdk.zip -Algorithm SHA256).Hash.ToLower() -ne '2a4f5e187992427674869e89477882d1ace4d67695d4b27173830d93f8cf11be') { throw 'SDK integrity mismatch' }
          Expand-Archive deps/sdk.zip deps/occt
          Invoke-WebRequest https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/3rdparty-vc14-64.zip -OutFile deps/thirdparty.zip
          Expand-Archive deps/thirdparty.zip deps/thirdparty
      - name: Build test and package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Publish v0.5.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.5.0 release/AxisForge-CAD-0.5.0-Windows-x64.zip --target ${{ github.sha }} --title 'AxisForge CAD 0.5.0' --notes-file RELEASE_NOTES.md
