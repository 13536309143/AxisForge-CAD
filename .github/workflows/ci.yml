name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation assets
        run: python3 scripts/verify-doc-assets.py
      - name: Install Qt and software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev ninja-build xvfb libgl1-mesa-dri libtbb-dev libfreetype6-dev libfontconfig1-dev libfreeimage-dev libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-visualization-dev libocct-ocaf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: build/test-artifacts
  windows-release:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'release: v')
    needs: linux-qt6
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Download official OCCT SDK
        shell: pwsh
        run: |
          ./scripts/setup-occt.ps1
      - name: Build test and package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(AxisForgeCAD VERSION (\d+\.\d+\.\d+)')
          if (-not $match.Success) { throw 'Missing application version' }
          $version = $match.Groups[1].Value
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -eq 0) {
            $tagHead = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha'
            if ($LASTEXITCODE) { throw 'Cannot inspect existing release tag' }
            git fetch origin $tagHead --no-tags
            if ($LASTEXITCODE) { throw 'Cannot fetch release baseline' }
            $applicationChanges = git diff --name-only $tagHead HEAD -- src tests CMakeLists.txt
            if ($LASTEXITCODE) { throw 'Cannot compare application sources' }
            if ($applicationChanges) { throw 'Existing release application code differs; use a new version' }
            gh release upload "v$version" "release/AxisForge-CAD-$version-Windows-x64.zip" "release/AxisForge-CAD-$version-Source.zip" release/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE) { throw 'Release asset replacement failed' }
            gh release edit "v$version" --notes-file RELEASE_NOTES.md
          } else {
            gh release create "v$version" "release/AxisForge-CAD-$version-Windows-x64.zip" "release/AxisForge-CAD-$version-Source.zip" release/SHA256SUMS.txt --target ${{ github.sha }} --title "AxisForge CAD $version" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }
