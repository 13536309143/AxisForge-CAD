name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev ninja-build xvfb libgl1-mesa-dri libtbb-dev libfreetype6-dev libfreeimage-dev libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-visualization-dev libocct-ocaf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: build/test-artifacts
